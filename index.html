<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Pokemon Card</title>
  <link rel="stylesheet" href="style.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;700;900&display=swap" rel="stylesheet"/>
</head>
<body>
  <div class="container">

    <!-- LEFT SECTION -->
    <div class="left">

      <!-- Logo -->
      <div class="logo">
        <img src="https://upload.wikimedia.org/wikipedia/commons/9/98/International_Pok%C3%A9mon_logo.svg" alt="Pokemon Logo"/>
      </div>

      <!-- Pokeball watermark -->
      <div class="pokeball"></div>

      <!-- Text -->
      <div class="content">
        <h4>POKEMON GEN I</h4>
        <h1>Pikachu</h1>
        <p>Pikachu is an Electric-type Pokémon introduced
          in Generation I. Pikachu are small, chubby,
          and incredibly cute mouse-like Pokémon.
          They are almost completely covered by yellow fur.</p>
        <div class="counter">
          <span class="line"></span>
          <span>01 / 08</span>
        </div>
      </div>

    </div>

    <!-- RIGHT SECTION -->
    <div class="right">

      <!-- Hamburger -->
      <div class="hamburger">
        <span></span>
        <span></span>
        <span></span>
      </div>

      <!-- Dots nav -->
      <div class="dots">
        <span class="dot active"></span>
        <span class="dot"></span>
        <span class="dot"></span>
        <span class="dot"></span>
      </div>

      <!-- Pikachu Image -->
      <img class="pikachu" src="https://www.pinclipart.com/picdir/middle/579-5794670_pikachu-pokemon-clipart.png" alt="Pikachu"/>

    </div>

  </div>
</body>
</html>
